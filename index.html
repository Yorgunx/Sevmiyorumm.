<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Ryn</title>
<meta name="description" content="Ryn">
<meta property="og:type" content="profile">
<meta property="og:title" content="Ryn">
<meta property="og:description" content="Ryn">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23000'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' font-family='Arial,sans-serif' font-weight='800' fill='%23fff'%3ER%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #000;
    --text: #fff;
    --muted: #8f8f99;
    --accent: #ffffff;
    --font: "Segoe UI Variable Display", "SF Pro Display", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  /* basılı tutup sürükleyince yazının mavi seçilmesini engeller */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  ::selection { background: transparent; color: inherit; }

  /* ---------- Arka plan katmanları ---------- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora i {
    position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
    filter: blur(70px); opacity: .55; will-change: transform;
  }
  .aurora i:nth-child(1) {
    left: -15vmax; top: -20vmax;
    background: radial-gradient(circle, rgba(255,255,255,.11), transparent 65%);
    animation: drift1 22s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(2) {
    right: -18vmax; bottom: -24vmax;
    background: radial-gradient(circle, rgba(190,190,205,.09), transparent 65%);
    animation: drift2 26s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-16vmax, -10vmax) scale(1.2); } }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

  /* fareyi takip eden ışık */
  .spot {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.12), transparent 60%);
  }
  /* ince film grenli doku */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 30; pointer-events: none; opacity: .06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- İsim ---------- */
  .stage {
    position: fixed; inset: 0; z-index: 3;
    display: grid; place-content: center; justify-items: center;
    perspective: 900px; padding: 24px; padding-bottom: 90px;
  }
  .halo {
    position: absolute; width: min(80vw, 560px); aspect-ratio: 1; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(150,150,165,.35), rgba(255,255,255,.18), rgba(255,255,255,0));
    filter: blur(70px); opacity: 0; animation: spin 18s linear infinite; pointer-events: none;
  }
  body.go .halo { opacity: .6; transition: opacity 2.2s ease .3s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .name {
    position: relative; margin: 0; display: flex; gap: .02em;
    font-size: clamp(88px, 27vw, 250px); font-weight: 800; letter-spacing: -.03em; line-height: 1;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform .25s ease-out;
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 16px rgba(255,255,255,.25)); }
    50%      { filter: drop-shadow(0 0 38px rgba(255,255,255,.6)); }
  }
  .name span {
    display: inline-block; opacity: 0;
    transform: translateY(60px) rotateX(-80deg) scale(.9);
    filter: blur(14px);
    background: linear-gradient(110deg, #fff 30%, #7d7d88 50%, #fff 70%);
    background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: 0 .02em;
  }
  body.go .name span {
    animation:
      letter 1.4s cubic-bezier(.2,.8,.2,1) calc(.35s + var(--i) * .16s) both,
      shine 6s linear calc(1.4s + var(--i) * .25s) infinite;
  }
  @keyframes letter { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes shine { from { background-position: 160% 0; } to { background-position: -100% 0; } }

  .line {
    width: 0; height: 2px; margin-top: clamp(10px, 3vw, 26px); border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), #fff, var(--accent), transparent);
    box-shadow: 0 0 16px rgba(255,255,255,.7);
  }
  body.go .line { animation: grow 1.6s cubic-bezier(.2,.8,.2,1) 1.2s forwards; }
  @keyframes grow { to { width: min(280px, 56vw); } }

  /* ---------- Giriş ekranı ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 10; background: #000;
    display: grid; place-items: center; cursor: pointer; user-select: none;
    clip-path: circle(150% at var(--gx, 50%) var(--gy, 50%));
    transition: clip-path 1.3s cubic-bezier(.7,0,.2,1), visibility 0s linear 1.3s;
  }
  #gate.out { clip-path: circle(0% at var(--gx, 50%) var(--gy, 50%)); visibility: hidden; pointer-events: none; }
  .gate-in { position: relative; display: grid; place-items: center; width: 160px; height: 160px; }
  .gate-in b {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.55); opacity: 0;
    animation: ripple 3.6s ease-out infinite;
  }
  .gate-in b:nth-child(2) { animation-delay: 1.2s; }
  .gate-in b:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ripple { 0% { transform: scale(.25); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
  .gate-in span {
    position: relative; color: var(--muted); letter-spacing: .45em; padding-left: .45em; font-size: 13px;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  /* ---------- Müzik çalar ---------- */
  #player {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 6;
    transform: translate(-50%, 24px);
    display: flex; align-items: center; gap: 12px;
    width: min(520px, calc(100vw - 24px)); padding: 12px 18px 16px;
    background: linear-gradient(180deg, rgba(32,32,34,.72), rgba(14,14,16,.72));
    border: 1px solid rgba(255,255,255,.12); border-radius: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 40px rgba(255,255,255,.08), inset 0 1px 0 rgba(255,255,255,.08);
    -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%);
    opacity: 0; transition: opacity 1s ease 1.8s, transform 1s cubic-bezier(.2,.8,.2,1) 1.8s;
  }
  body.go #player { opacity: 1; transform: translate(-50%, 0); }
  #player[hidden] { display: none; }

  .eq { display: flex; gap: 3px; align-items: flex-end; height: 22px; flex: none; }
  .eq i {
    width: 3px; height: 100%; border-radius: 2px; background: var(--accent);
    box-shadow: 0 0 8px rgba(255,255,255,.7);
    transform-origin: bottom; transform: scaleY(.2);
    animation: eq 1s ease-in-out infinite; animation-play-state: paused;
  }
  .eq i:nth-child(2) { animation-duration: .8s; animation-delay: -.3s; }
  .eq i:nth-child(3) { animation-duration: 1.15s; animation-delay: -.6s; }
  .eq i:nth-child(4) { animation-duration: .9s; animation-delay: -.1s; }
  body.playing .eq i { animation-play-state: running; }
  @keyframes eq { 0%, 100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }

  .meta { display: grid; min-width: 0; flex: 1; line-height: 1.25; }
  #track { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .ctrl { display: flex; align-items: center; gap: 4px; flex: none; }
  #player button {
    font: inherit; color: var(--text); background: none; border: 0; cursor: pointer;
    width: 34px; height: 34px; border-radius: 50%; font-size: 15px; line-height: 1;
    display: grid; place-items: center; transition: background .2s, color .2s, box-shadow .2s, transform .15s;
  }
  #player button:hover { background: rgba(255,255,255,.16); color: var(--accent); }
  #player button:active { transform: scale(.92); }
  #player button[hidden] { display: none; }
  #prev, #next { font-size: 20px !important; }
  #pp { background: var(--text) !important; color: #000 !important; width: 38px !important; height: 38px !important;
    box-shadow: 0 0 18px rgba(255,255,255,.25); }
  #pp:hover { box-shadow: 0 0 22px rgba(255,255,255,.6); }

  #vol { width: 84px; flex: none; accent-color: var(--accent); cursor: pointer; }
  #prog { position: absolute; left: 20px; right: 20px; bottom: 5px; height: 12px; cursor: pointer; }
  #prog::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 2px;
    background: rgba(255,255,255,.14); border-radius: 2px; }
  #prog i { position: absolute; left: 0; top: 5px; height: 2px; width: 0; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), #fff); box-shadow: 0 0 10px var(--accent); }
  #player button:focus-visible, #vol:focus-visible, #gate:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (max-width: 520px) { #vol { width: 64px; } .eq { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    .aurora i, .halo, .name { animation: none; }
    .name span { opacity: 1; transform: none; filter: none; animation: none !important; }
    .line { width: min(280px, 56vw); animation: none !important; }
    #gate, #gate.out { transition: none; }
    .gate-in b, .gate-in span { animation: none; }
    #player { transition: none; }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="spot" aria-hidden="true"></div>

<main class="stage">
  <div class="halo" aria-hidden="true"></div>
  <h1 class="name" id="name" aria-label="Ryn">Ryn</h1>
  <div class="line" aria-hidden="true"></div>
</main>

<audio id="bgm" preload="auto"></audio>
<div id="player" hidden role="group" aria-label="Müzik çalar">
  <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="meta"><span id="track"></span><span id="time">0:00</span></div>
  <div class="ctrl">
    <button id="prev" type="button" aria-label="Önceki şarkı" hidden>&#9198;&#xFE0E;</button>
    <button id="pp" type="button" aria-label="Durdur veya oynat">&#10074;&#10074;</button>
    <button id="next" type="button" aria-label="Sonraki şarkı" hidden>&#9197;&#xFE0E;</button>
  </div>
  <input id="vol" type="range" min="0" max="100" value="50" aria-label="Ses">
  <div id="prog" aria-hidden="true"><i></i></div>
</div>

<div id="gate" role="button" tabindex="0" aria-label="Girmek için tıkla">
  <div class="gate-in"><b></b><b></b><b></b><span>tıkla</span></div>
</div>
<noscript><style>#gate{display:none}.name span{opacity:1!important;transform:none!important;filter:none!important}</style></noscript>

<script>
  /* ---------- Şarkılar ----------
     mp3 dosyasını bu dosyanın yanına koy, adını buraya yaz.
     Tek şarkı varsa sürekli tekrar eder. Birden fazla yazarsan sırayla çalar. */
  const PLAYLIST = [
    { title: "Şarkının adı", src: "song.mp3" }
  ];
  const ARTIST = "Ryn";

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mouse = { x: -9999, y: -9999 };

  /* ---------- İsim harfleri ---------- */
  (function () {
    const el = document.getElementById("name");
    el.textContent = "";
    [..."Ryn"].forEach((ch, i) => {
      const s = document.createElement("span");
      s.textContent = ch;
      s.style.setProperty("--i", i);
      s.setAttribute("aria-hidden", "true");
      el.appendChild(s);
    });
  })();

  /* ---------- Fare: ışık ve hafif 3D eğilme ---------- */
  (function () {
    const root = document.documentElement;
    let ticking = false, px = 0, py = 0;
    addEventListener("pointermove", e => {
      mouse.x = px = e.clientX; mouse.y = py = e.clientY;
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        root.style.setProperty("--mx", px + "px");
        root.style.setProperty("--my", py + "px");
        if (!reduced) {
          root.style.setProperty("--rx", ((py / innerHeight - .5) * -14).toFixed(2) + "deg");
          root.style.setProperty("--ry", ((px / innerWidth - .5) * 18).toFixed(2) + "deg");
        }
      });
    });
    document.addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });
  })();

  /* ---------- Hareketli arka plan: yıldızlar, çizgiler, kayan yıldızlar ---------- */
  (function () {
    const c = document.getElementById("fx");
    const ctx = c.getContext("2d");
    const COLORS = ["255,255,255", "205,205,215", "150,150,162"];
    const rnd = (a, b) => a + Math.random() * (b - a);
    let w, h, P = [], B = [], S = [], last = 0, nextShoot = 2500;

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      c.width = w * dpr; c.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(Math.min(110, Math.max(34, w * h / 16000)));
      P = Array.from({ length: n }, () => ({
        x: rnd(0, w), y: rnd(0, h), vx: rnd(-.22, .22), vy: rnd(-.22, .22),
        r: rnd(.8, 2.2), c: COLORS[(Math.random() * COLORS.length) | 0], ph: rnd(0, 6.28)
      }));
      if (reduced) draw(0, 0);
    }

    function draw(t, dt) {
      ctx.clearRect(0, 0, w, h);
      ctx.globalCompositeOperation = "lighter";

      for (const p of P) {
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x < -10) p.x = w + 10; else if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10; else if (p.y > h + 10) p.y = -10;
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
        if (d < 150 && d > 0) {                      // fareden hafifçe kaçarlar
          const f = (1 - d / 150) * 1.1 * dt;
          p.x += dx / d * f; p.y += dy / d * f;
        }
      }

      // yıldızlar arası çizgiler
      ctx.lineWidth = 1;
      for (let i = 0; i < P.length; i++) {
        for (let j = i + 1; j < P.length; j++) {
          const dx = P[i].x - P[j].x, dy = P[i].y - P[j].y;
          const d2 = dx * dx + dy * dy;
          if (d2 < 16900) {
            ctx.strokeStyle = `rgba(255,255,255,${(1 - Math.sqrt(d2) / 130) * .17})`;
            ctx.beginPath(); ctx.moveTo(P[i].x, P[i].y); ctx.lineTo(P[j].x, P[j].y); ctx.stroke();
          }
        }
        // fareye yakın olanlara parlak çizgi
        const mx = P[i].x - mouse.x, my = P[i].y - mouse.y, md = Math.hypot(mx, my);
        if (md < 180) {
          ctx.strokeStyle = `rgba(255,255,255,${(1 - md / 180) * .5})`;
          ctx.beginPath(); ctx.moveTo(P[i].x, P[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
        }
      }

      // yıldızlar (parıldar)
      for (const p of P) {
        const a = .55 + .45 * Math.sin(t * .002 + p.ph);
        ctx.fillStyle = `rgba(${p.c},${a * .09})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, 6.283); ctx.fill();
        ctx.fillStyle = `rgba(${p.c},${a})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }

      // tıklama patlamaları
      for (let i = B.length - 1; i >= 0; i--) {
        const b = B[i];
        b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= .96; b.vy *= .96; b.life -= .022 * dt;
        if (b.life <= 0) { B.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(${b.c},${b.life})`;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (.5 + b.life), 0, 6.283); ctx.fill();
      }

      // kayan yıldızlar
      if (!reduced) {
        nextShoot -= dt * 16.67;
        if (nextShoot <= 0) {
          S.push({ x: rnd(0, w * .7), y: rnd(0, h * .35), vx: rnd(9, 13), vy: rnd(3.5, 6), life: 1 });
          nextShoot = rnd(4500, 9500);
        }
        for (let i = S.length - 1; i >= 0; i--) {
          const s = S[i];
          s.x += s.vx * dt; s.y += s.vy * dt; s.life -= .012 * dt;
          if (s.life <= 0 || s.x > w + 150 || s.y > h + 150) { S.splice(i, 1); continue; }
          const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 12, s.y - s.vy * 12);
          g.addColorStop(0, `rgba(255,255,255,${s.life})`);
          g.addColorStop(1, "rgba(255,255,255,0)");
          ctx.strokeStyle = g; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 12, s.y - s.vy * 12); ctx.stroke();
        }
      }
      ctx.globalCompositeOperation = "source-over";
    }

    function loop(t) {
      const dt = Math.min(50, t - last) / 16.67;
      last = t;
      draw(t, dt);
      requestAnimationFrame(loop);
    }

    addEventListener("resize", resize);
    resize();
    if (!reduced) requestAnimationFrame(t => { last = t; loop(t); });

    // tıklayınca parçacık saçılır
    addEventListener("pointerdown", e => {
      if (reduced || (e.target.closest && e.target.closest("#player, #gate"))) return;
      for (let i = 0; i < 16; i++) {
        const a = Math.random() * 6.283, s = rnd(1.5, 5);
        B.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                 life: 1, r: rnd(1, 2.6), c: COLORS[(Math.random() * COLORS.length) | 0] });
      }
    });
  })();

  /* ---------- Giriş ekranı + müzik çalar ---------- */
  (function () {
    const $ = id => document.getElementById(id);
    const gate = $("gate"), bgm = $("bgm"), player = $("player"), trackEl = $("track"), timeEl = $("time");
    const vol = $("vol"), pp = $("pp"), prev = $("prev"), next = $("next"), prog = $("prog");
    const bar = prog.firstElementChild;
    const many = PLAYLIST.length > 1;
    let i = 0, entered = false, fading = false, failed = 0;

    prev.hidden = next.hidden = !many;
    bgm.loop = !many;

    let v = 50;   // kayıtlı ses seviyesi (yoksa 50)
    try {
      const saved = localStorage.getItem("bio_vol");
      if (saved !== null) v = Math.min(100, Math.max(0, Number(saved) || 0));
    } catch (e) {}
    vol.value = v;
    bgm.volume = v / 100;

    const fmt = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
    function updateTime() {
      timeEl.textContent = bgm.duration ? fmt(bgm.currentTime) + " / " + fmt(bgm.duration) : fmt(bgm.currentTime);
      if (bgm.duration) bar.style.width = (bgm.currentTime / bgm.duration * 100) + "%";
    }

    function play(idx) {
      i = (idx + PLAYLIST.length) % PLAYLIST.length;
      bgm.src = PLAYLIST[i].src;
      trackEl.textContent = PLAYLIST[i].title;
      bar.style.width = "0%";
      const p = bgm.play();
      if (p && p.catch) p.catch(() => {});
      if ("mediaSession" in navigator && window.MediaMetadata) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: PLAYLIST[i].title, artist: ARTIST });
      }
    }
    const toggle = () => { bgm.paused ? bgm.play() : bgm.pause(); };

    if ("mediaSession" in navigator) {
      const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
      set("play", () => bgm.play());
      set("pause", () => bgm.pause());
      if (many) { set("previoustrack", () => play(i - 1)); set("nexttrack", () => play(i + 1)); }
    }

    // şarkı dosyası bulunamazsa çalar gizlenir, site yine çalışır
    bgm.addEventListener("error", () => {
      failed++;
      if (!many || failed >= PLAYLIST.length) { player.hidden = true; return; }
      play(i + 1);
    });
    bgm.addEventListener("playing", () => { failed = 0; });
    bgm.addEventListener("play", () => { pp.innerHTML = "&#10074;&#10074;"; document.body.classList.add("playing"); });
    bgm.addEventListener("pause", () => { pp.innerHTML = "&#9654;&#xFE0E;"; document.body.classList.remove("playing"); });
    bgm.addEventListener("ended", () => { if (many) play(i + 1); });
    bgm.addEventListener("timeupdate", updateTime);
    bgm.addEventListener("loadedmetadata", updateTime);

    function enter(e) {
      if (entered) return;
      entered = true;
      // giriş ekranı, tıkladığın noktaya doğru daralarak kapanır
      const x = e && e.clientX !== undefined ? e.clientX : innerWidth / 2;
      const y = e && e.clientY !== undefined ? e.clientY : innerHeight / 2;
      gate.style.setProperty("--gx", x + "px");
      gate.style.setProperty("--gy", y + "px");
      gate.classList.add("out");
      document.body.classList.add("go");
      player.hidden = false;

      bgm.volume = 0;
      play(0);

      // sesi 2.5 saniyede yavaşça aç (kaydırıcıya dokunursan durur)
      fading = true;
      const t0 = performance.now();
      (function fade(t) {
        if (!fading) return;
        const k = Math.max(0, Math.min(1, (t - t0) / 2500));
        bgm.volume = (vol.value / 100) * k;
        if (k < 1) requestAnimationFrame(fade); else fading = false;
      })(t0);
    }

    function applyVolume() {
      fading = false;
      bgm.volume = vol.value / 100;
      try { localStorage.setItem("bio_vol", vol.value); } catch (e) {}
    }

    gate.addEventListener("click", enter);
    gate.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enter(); }
    });
    prev.addEventListener("click", () => play(i - 1));
    next.addEventListener("click", () => play(i + 1));
    pp.addEventListener("click", toggle);
    vol.addEventListener("input", applyVolume);
    prog.addEventListener("click", e => {
      const r = prog.getBoundingClientRect();
      if (bgm.duration) bgm.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * bgm.duration;
    });

    // Boşluk: durdur/oynat, ↑ ↓: ses, ← →: 5 sn geri/ileri
    document.addEventListener("keydown", e => {
      if (!entered || e.target.id === "gate" || (e.target.closest && e.target.closest("button, input"))) return;
      if (e.key === " ") { e.preventDefault(); toggle(); }
      else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        vol.value = Math.min(100, Math.max(0, Number(vol.value) + (e.key === "ArrowUp" ? 5 : -5)));
        applyVolume();
      } else if (e.key === "ArrowRight" && bgm.duration) bgm.currentTime = Math.min(bgm.duration, bgm.currentTime + 5);
      else if (e.key === "ArrowLeft") bgm.currentTime = Math.max(0, bgm.currentTime - 5);
    });
  })();
</script>
</body>
</html>
